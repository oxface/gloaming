# Explicit lane inputs, including dependent consumers. Update this map when project
# references, linked fixtures or template source snapshots change.
# some-with-excludes makes !**/*.md an exclusion across every positive pattern.

shared:
  - '.github/**'
  - '.config/**'
  - 'tools/repository/**'
  - '**/*.{csproj,props,targets,slnx}'
  - 'global.json'
  - 'NuGet.Config'
  - '!**/*.md'
  - '!archive/**'
  - '!templates/**'

# New inputs outside the mapped roots conservatively request full coverage.
unmapped:
  - '**'
  - '!**/*.md'
  - '!archive/**'
  - '!src/Gloaming.{Auditing,ActorIdentity,EventReactions,EntityFrameworkCore,Tenancy,Persistence,Events,EventSourcing,Messaging}/**'
  - '!samples/{EventStorageDemo,EventStorageDemo.Tests,OutboxDemo,OutboxDemo.Tests,InboxDemo,InboxDemo.Tests,MessagingDemo,MessagingProducerDemo,MessagingWorkerDemo,MessagingWorkerDemo.Tests}/**'
  - '!samples/Wholesale/**'
  - '!samples/EventReactionsDemo/**'
  - '!tests/ArchitectureTests/**'
  - '!tests/Support/{PostgreSqlFixture,RabbitMqFixture}.cs'
  - '!templates/**'
  - '!tools/template/**'

Auditing:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.Auditing/**'
  - 'src/Gloaming.ActorIdentity/Gloaming.ActorIdentity/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - '!**/*.md'

ActorIdentity:
  - 'src/Gloaming.ActorIdentity/**'
  - '!**/*.md'

EventReactions:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore/**'
  - 'src/Gloaming.Messaging/Gloaming.Messaging{,.EntityFrameworkCore,.EntityFrameworkCore.Postgres}/**'
  - 'src/Gloaming.EventReactions/**'
  - 'samples/EventReactionsDemo/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - '!**/*.md'

Tenancy:
  - 'src/Gloaming.Tenancy/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - '!**/*.md'

Persistence:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.Persistence/**'
  - 'src/Gloaming.Tenancy/Gloaming.Tenancy/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - '!**/*.md'

Events:
  - 'src/Gloaming.Events/**'
  - 'samples/Wholesale/EventCodecDemo{,.Tests}/**'
  - '!**/*.md'

# EventPersistenceDemo composes event sourcing, messaging and accepted-change audit.
# Its owning lanes include those dependencies and the module implementation paths.
EventSourcing:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.EventReactions/Gloaming.*/**'
  - 'src/Gloaming.EventSourcing/**'
  - 'src/Gloaming.{Events,Messaging,Auditing}/Gloaming.*/**'
  - 'src/Gloaming.ActorIdentity/Gloaming.ActorIdentity/**'
  - 'src/Gloaming.Tenancy/Gloaming.Tenancy/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore.Postgres/**'
  - 'samples/EventStorageDemo{,.Tests}/**'
  - 'samples/Wholesale/{modules,EventPersistenceDemo,EventPersistenceDemo.Tests}/**'
  - 'tests/Support/{PostgreSqlFixture,RabbitMqFixture}.cs'
  - '!**/*.md'

Messaging:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.EventReactions/Gloaming.*/**'
  - 'src/Gloaming.Messaging/**'
  - 'src/Gloaming.{EventSourcing,Events,Auditing}/Gloaming.*/**'
  - 'src/Gloaming.ActorIdentity/Gloaming.ActorIdentity/**'
  - 'src/Gloaming.Tenancy/Gloaming.Tenancy/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore.Postgres/**'
  - 'samples/{OutboxDemo,OutboxDemo.Tests,InboxDemo,InboxDemo.Tests,MessagingDemo,MessagingProducerDemo,MessagingWorkerDemo,MessagingWorkerDemo.Tests}/**'
  - 'samples/Wholesale/{modules,EventPersistenceDemo,EventPersistenceDemo.Tests}/**'
  - 'samples/Wholesale/ServiceDefaults/**'
  - 'samples/Wholesale/{WorkflowDemo,LocalWorkflowDemo}{,.Tests}/**'
  - 'samples/MessagingWorkerDemo.Tests/ChildHost.cs'
  - 'tests/Support/{PostgreSqlFixture,RabbitMqFixture}.cs'
  - '!**/*.md'

wholesale:
  - 'src/Gloaming.*/Gloaming.*/**'
  - 'samples/Wholesale/CqrsDemo{,.Tests}/**'
  - 'samples/Wholesale/{ContextDemo,ContextDemo.Tests,PersistenceDemo,PersistenceDemo.Tests,HttpIdentityDemo,HttpIdentityDemo.Tests,DddDemo,DddDemo.Tests,RichAggregateDemo,RichAggregateDemo.Tests,DomainEventsDemo,DomainEventsDemo.Tests,modules,ServiceDefaults}/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - 'samples/Wholesale/{WorkflowDemo,LocalWorkflowDemo}{,.Tests}/**'
  - '!**/*.md'

template:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'tools/template/**'
  - 'templates/**'
  - 'src/Gloaming.ActorIdentity/Gloaming.ActorIdentity/**'
  - 'src/Gloaming.Tenancy/Gloaming.Tenancy/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore/**'
  - '!**/*.md'

runtime:
  - 'samples/Wholesale/**'
  - '!**/*.md'

repository_dotnet:
  - 'src/**'
  - 'samples/**'
  - 'tests/**'
  - 'templates/**'
  - '!**/*.md'
