# Environment-specific proof inputs. Ordinary .NET test dependencies are inferred by Nx.
# some-with-excludes applies each exclusion across every positive pattern.
shared:
  - '.github/**'
  - '.config/**'
  - 'eng/repository/**'
  - '**/*.{csproj,props,targets,slnx}'
  - 'global.json'
  - 'NuGet.Config'
  - 'package.json'
  - 'package-lock.json'
  - 'nx.json'
  - '!**/*.md'

# Inputs outside the existing source/tool roots conservatively request full proofs.
unmapped:
  - '**'
  - '!**/*.md'
  - '!src/**'
  - '!samples/Wholesale/**'
  - '!tests/ArchitectureTests/**'
  - '!tests/ContextCompositionTests/**'
  - '!tests/Support/{PostgreSqlFixture,RabbitMqFixture,ChildHost}.cs'
  - '!eng/release/**'

repository_dotnet:
  - 'src/**'
  - 'samples/**'
  - 'tests/**'
  - '!**/*.md'

# Package README links are artifact content, so this lane includes their changes.
packages:
  - 'src/Gloaming.Persistence/tests/Fixtures/JsonOwnership/**'
  - 'src/Gloaming.Agents/samples/AgentPersistenceDemo/**'
  - 'src/Gloaming.Evaluations/samples/WorkflowEvaluationDemo/**'
  - 'src/Gloaming.*/Gloaming.*/**'
  - 'src/Gloaming.*/README.md'
  - 'src/Gloaming.*/docs/**'
  - 'src/Directory.Build.props'
  - 'eng/release/**'
  - 'modular-monolith-patterns/kafka.md'

# Kafka's package consumer uses only this native messaging closure and DI.
kafka:
  - 'src/Gloaming.EntityFrameworkCore/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.Messaging/Gloaming.Messaging/**'
  - 'src/Gloaming.Messaging/Gloaming.Messaging.EntityFrameworkCore/**'
  - 'src/Gloaming.Messaging/Gloaming.Messaging.EntityFrameworkCore.Postgres/**'
  - 'eng/release/**'
  - 'modular-monolith-patterns/kafka.md'
