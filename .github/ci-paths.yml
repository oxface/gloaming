# Explicit lane inputs, including dependent consumers. Update this map when project
# references, linked fixtures or adoption proofs change.
# some-with-excludes makes !**/*.md an exclusion across every positive pattern.

shared:
  - '.github/**'
  - '.config/**'
  - 'tools/repository/**'
  - '**/*.{csproj,props,targets,slnx}'
  - 'global.json'
  - 'NuGet.Config'
  - '!**/*.md'

# New inputs outside the mapped roots conservatively request full coverage.
unmapped:
  - '**'
  - '!**/*.md'
  - '!src/Gloaming.{Auditing,ActorIdentity,CommandReceipts,EventReactions,EntityFrameworkCore,Tenancy,Persistence,Events,EventSourcing,Messaging}/**'
  - '!samples/Wholesale/**'
  - '!tests/ArchitectureTests/**'
  - '!tests/ContextCompositionTests/**'
  - '!tests/Support/{PostgreSqlFixture,RabbitMqFixture,ChildHost}.cs'
  - '!tools/release/**'

EntityFrameworkCore:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - '!**/*.md'

CommandReceipts:
  - 'src/Gloaming.CommandReceipts/**'
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'tests/Support/{PostgreSqlFixture,ChildHost}.cs'
  - '!**/*.md'

Auditing:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.Auditing/**'
  - 'src/Gloaming.ActorIdentity/Gloaming.ActorIdentity/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - '!**/*.md'

ActorIdentity:
  - 'src/Gloaming.ActorIdentity/**'
  - '!**/*.md'

EventReactions:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore/**'
  - 'src/Gloaming.Messaging/Gloaming.Messaging{,.EntityFrameworkCore,.EntityFrameworkCore.Postgres}/**'
  - 'src/Gloaming.EventReactions/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - 'tests/Support/ChildHost.cs'
  - '!**/*.md'

Tenancy:
  - 'src/Gloaming.Tenancy/**'
  - 'tests/ContextCompositionTests/**'
  - 'src/Gloaming.ActorIdentity/Gloaming.ActorIdentity/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - '!**/*.md'

Persistence:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.Persistence/**'
  - 'src/Gloaming.Tenancy/Gloaming.Tenancy/**'
  - 'tests/Support/PostgreSqlFixture.cs'
  - '!**/*.md'

Events:
  - 'src/Gloaming.Events/**'
  - 'tests/Support/ChildHost.cs'
  - '!**/*.md'

# Wholesale composes event sourcing, messaging and accepted-change audit.
# Its owning lanes include those dependencies and the module implementation paths.
EventSourcing:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.EventReactions/Gloaming.*/**'
  - 'src/Gloaming.EventSourcing/**'
  - 'src/Gloaming.{Events,Messaging,Auditing}/Gloaming.*/**'
  - 'src/Gloaming.ActorIdentity/Gloaming.ActorIdentity/**'
  - 'src/Gloaming.Tenancy/Gloaming.Tenancy/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore.Postgres/**'
  - 'samples/Wholesale/{modules,Api,Worker,IntegrationTests}/**'
  - 'tests/Support/{PostgreSqlFixture,RabbitMqFixture}.cs'
  - 'tests/Support/ChildHost.cs'
  - '!**/*.md'

Messaging:
  - 'src/Gloaming.EntityFrameworkCore/**'
  - 'src/Gloaming.EventReactions/Gloaming.*/**'
  - 'src/Gloaming.Messaging/**'
  - 'src/Gloaming.{EventSourcing,Events,Auditing}/Gloaming.*/**'
  - 'src/Gloaming.ActorIdentity/Gloaming.ActorIdentity/**'
  - 'src/Gloaming.Tenancy/Gloaming.Tenancy/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore/**'
  - 'src/Gloaming.Persistence/Gloaming.Persistence.EntityFrameworkCore.Postgres/**'
  - 'src/Gloaming.Messaging/samples/**'
  - 'samples/Wholesale/{modules,Api,Worker,IntegrationTests}/**'
  - 'tests/Support/ChildHost.cs'
  - 'tests/Support/{PostgreSqlFixture,RabbitMqFixture}.cs'
  - '!**/*.md'

wholesale:
  - 'src/Gloaming.*/Gloaming.*/**'
  - 'samples/Wholesale/{Api,Worker,IntegrationTests,modules,ServiceDefaults}/**'
  - 'src/Gloaming.Events/samples/EventCodecDemo/Fixtures/**'
  - 'tests/Support/ChildHost.cs'
  - 'tests/Support/{PostgreSqlFixture,RabbitMqFixture}.cs'
  - '!**/*.md'


runtime:
  - 'samples/Wholesale/**'
  - '!**/*.md'

repository_dotnet:
  - 'src/**'
  - 'samples/**'
  - 'tests/**'
  - '!**/*.md'

# Package README links are artifact content, so this lane includes their changes.
packages:
  - 'src/Gloaming.*/Gloaming.*/**'
  - 'src/Gloaming.*/README.md'
  - 'src/Gloaming.*/docs/**'
  - 'src/Directory.Build.props'
  - 'tools/release/**'
